<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b040c">
<title>Big Bite Stadionparken - Manager View</title>
<style>
:root {
  --red:#6b040c;
  --yellow:#f4b51f;
  --green:#198754;
  --ink:#111827;
  --muted:#667085;
  --bg:#f5f6f8;
  --card:#ffffff;
  --line:#e3e7ec;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
.app{
  width:min(100%,900px);
  margin:0 auto;
  padding:clamp(10px,2.5vw,18px);
}
.hero{
  background:var(--red);
  color:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
}
.brand{
  font-size:clamp(24px,5vw,30px);
  font-weight:900;
  display:inline-block;
  border-bottom:6px solid var(--yellow);
  padding-bottom:4px;
}
.hero h1{margin:14px 0 4px;font-size:clamp(18px,4vw,22px)}
.hero p{margin:0;opacity:.95}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.hidden{display:none!important}
.field input, .field select{
  display:block;
  width:100%;
  margin-top:7px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  font-size:16px;
}
.field{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:12px;
}
.btn{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:10px 18px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
.btn-primary{background:var(--red);color:white}
.btn-light{background:#fff;border:1px solid var(--line);color:var(--ink)}
.message{
  margin-top:12px;
  padding:12px;
  border-radius:11px;
  background:#f2f4f7;
  font-size:14px;
  line-height:1.45;
}
.error{background:#fff1f2;color:#991b1b}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:flex-end;
  margin-bottom:14px;
}
.controls .field{margin-bottom:0;min-width:140px}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th, td{
  text-align:left;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.pill{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}
.pill-opening{background:#fff6e0;color:#8a5a00}
.pill-closing{background:#fde8e8;color:#a3121a}
.coverage-grid{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px 16px;
  align-items:center;
  font-size:14px;
}
.coverage-grid .date{font-weight:800}
.status-ok{color:var(--green);font-weight:900}
.status-missing{color:var(--red);font-weight:900}
.table-wrap{overflow-x:auto}
.small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="brand">BIG BITE</div>
    <h1>Manager view</h1>
    <p>Big Bite Stadionparken — checklist submissions</p>
  </header>

  <section id="loginCard" class="card">
    <p class="small">Enter the manager passcode to view submitted checklists.</p>
    <label class="field">Passcode
      <input id="passcode" type="password" placeholder="Passcode" autocomplete="off">
    </label>
    <button id="loginBtn" class="btn btn-primary" type="button">View reports</button>
    <div id="loginMessage" class="message hidden"></div>
  </section>

  <section id="reportsCard" class="card hidden">
    <div class="controls">
      <label class="field">Show last
        <select id="daysSelect">
          <option value="7">7 days</option>
          <option value="14" selected>14 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
      <button id="refreshBtn" class="btn btn-light" type="button">Refresh</button>
      <button id="logoutBtn" class="btn btn-light" type="button">Log out</button>
    </div>

    <h3 style="margin-top:0">Daily coverage</h3>
    <div id="coverage" class="coverage-grid"></div>

    <h3>Submissions</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Employee</th><th>Submitted</th><th>Progress</th></tr>
        </thead>
        <tbody id="reportsBody"></tbody>
      </table>
    </div>
    <div id="reportsMessage" class="message hidden"></div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var ENDPOINT = "https://script.google.com/macros/s/AKfycbzLSOPLQ6fiE6ZMTVMpkRJ_QNkg9_CUWTuEeKEtaAemCIwRvItRMlji0-kH67XXW8cr/exec";

  var passcode = "";
  var loginCard = document.getElementById("loginCard");
  var reportsCard = document.getElementById("reportsCard");

  function fmtTime(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    return d.toLocaleString();
  }

  /*
   * Apps Script's /exec endpoint redirects through googleusercontent.com
   * without a CORS header, so fetch() from this page's origin (GitHub
   * Pages) gets blocked before it can read the response. Loading the
   * response through a <script> tag (classic JSONP) isn't subject to CORS,
   * so this sidesteps the problem. Code.gs wraps its JSON in a call to the
   * callback name we pass here when a "callback" query param is present.
   */
  function jsonpRequest(url, callback){
    var callbackName = "bigbiteJsonp" + Date.now() + Math.floor(Math.random() * 100000);
    var script = document.createElement("script");
    var timeoutId;

    function cleanup(){
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeoutId);
    }

    window[callbackName] = function(data){
      cleanup();
      callback(null, data);
    };

    script.onerror = function(){
      cleanup();
      callback(new Error("Network error while loading data."));
    };

    timeoutId = setTimeout(function(){
      cleanup();
      callback(new Error("Request timed out. Check the passcode and try again."));
    }, 15000);

    var separator = url.indexOf("?") >= 0 ? "&" : "?";
    script.src = url + separator + "callback=" + encodeURIComponent(callbackName);
    document.body.appendChild(script);
  }

  function renderCoverage(reports){
    var byDate = {};
    reports.forEach(function(r){
      var d = r.date || "";
      if(!byDate[d]) byDate[d] = {opening:false, closing:false};
      if(r.type === "opening") byDate[d].opening = true;
      else byDate[d].closing = true;
    });
    var dates = Object.keys(byDate).sort().reverse();
    var el = document.getElementById("coverage");
    el.innerHTML = "";

    if(dates.length === 0){
      el.innerHTML = "<div class='small'>No submissions in this range.</div>";
      return;
    }

    dates.forEach(function(d){
      var row = byDate[d];
      var dateEl = document.createElement("div");
      dateEl.className = "date";
      dateEl.textContent = d;

      var openEl = document.createElement("div");
      openEl.innerHTML = "Opening: " + (row.opening ? "<span class='status-ok'>✓ done</span>" : "<span class='status-missing'>✗ missing</span>");

      var closeEl = document.createElement("div");
      closeEl.innerHTML = "Closing: " + (row.closing ? "<span class='status-ok'>✓ done</span>" : "<span class='status-missing'>✗ missing</span>");

      el.appendChild(dateEl);
      el.appendChild(openEl);
      el.appendChild(closeEl);
    });
  }

  function renderTable(reports){
    var body = document.getElementById("reportsBody");
    body.innerHTML = "";
    reports.forEach(function(r){
      var tr = document.createElement("tr");

      var tdDate = document.createElement("td");
      tdDate.textContent = r.date || "";

      var tdType = document.createElement("td");
      var pill = document.createElement("span");
      pill.className = "pill " + (r.type === "opening" ? "pill-opening" : "pill-closing");
      pill.textContent = r.type === "opening" ? "Opening" : "Closing";
      tdType.appendChild(pill);

      var tdEmployee = document.createElement("td");
      tdEmployee.textContent = r.employee || "";

      var tdTime = document.createElement("td");
      tdTime.textContent = fmtTime(r.timestamp);

      var tdProgress = document.createElement("td");
      tdProgress.textContent = r.progress || "";

      tr.appendChild(tdDate);
      tr.appendChild(tdType);
      tr.appendChild(tdEmployee);
      tr.appendChild(tdTime);
      tr.appendChild(tdProgress);
      body.appendChild(tr);
    });
  }

  function loadReports(){
    var days = document.getElementById("daysSelect").value;
    var msg = document.getElementById("reportsMessage");
    msg.classList.add("hidden");

    var url = ENDPOINT + "?action=list&passcode=" + encodeURIComponent(passcode) + "&days=" + encodeURIComponent(days);

    jsonpRequest(url, function(error, result){
      if(error){
        msg.textContent = "Error loading reports: " + error.message;
        msg.classList.remove("hidden");
        msg.classList.add("error");
        return;
      }
      if(!result || result.success !== true){
        msg.textContent = "Error loading reports: " + (result && result.error ? result.error : "Could not load reports.");
        msg.classList.remove("hidden");
        msg.classList.add("error");
        return;
      }
      var reports = result.reports || [];
      renderCoverage(reports);
      renderTable(reports);
    });
  }

  document.getElementById("loginBtn").addEventListener("click", function(){
    var input = document.getElementById("passcode");
    var msg = document.getElementById("loginMessage");
    if(!input.value.trim()){
      msg.textContent = "Please enter the passcode.";
      msg.classList.remove("hidden");
      return;
    }
    passcode = input.value.trim();

    var url = ENDPOINT + "?action=list&passcode=" + encodeURIComponent(passcode) + "&days=1";
    jsonpRequest(url, function(error, result){
      if(error){
        msg.textContent = error.message;
        msg.classList.remove("hidden");
        msg.classList.add("error");
        return;
      }
      if(!result || result.success !== true){
        msg.textContent = result && result.error ? result.error : "Invalid passcode.";
        msg.classList.remove("hidden");
        msg.classList.add("error");
        return;
      }
      loginCard.classList.add("hidden");
      reportsCard.classList.remove("hidden");
      loadReports();
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", loadReports);
  document.getElementById("daysSelect").addEventListener("change", loadReports);

  document.getElementById("logoutBtn").addEventListener("click", function(){
    passcode = "";
    document.getElementById("passcode").value = "";
    reportsCard.classList.add("hidden");
    loginCard.classList.remove("hidden");
  });

  document.getElementById("passcode").addEventListener("keydown", function(e){
    if(e.key === "Enter") document.getElementById("loginBtn").click();
  });
})();
</script>
</body>
</html>
